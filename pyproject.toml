[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "live-commerce-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "playwright>=1.51,<2", "langchain-core>=1.2.22,<2", "langchain-openai>=1,<2", "langgraph>=1,<2", "pydantic-settings>=2.8,<3", "pyyaml>=6,<7", "sqlite-vec>=0.1.9,<0.2", "websockets>=15,<18"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.11"]

[project.scripts]
live-agent = "live_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=data/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
